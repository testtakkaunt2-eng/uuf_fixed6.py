<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>GOLD SMC v19 ULTIMATE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="hdr glass">
    <div class="hdr-left">
      <div class="subtitle">XAUUSD (EXNESS/XM)</div>
      <div class="price" id="price">...</div>
    </div>
    <div class="hdr-right">
      <div class="badge" id="bias">15m: ...</div>
      <div class="offset-text" id="offset">Offset: ...</div>
    </div>
  </div>

  <div class="grid">
    <button class="btn btn-gold" onclick="act('signal')"><i class="fa-solid fa-chart-simple"></i> Signal</button>
    <button class="btn btn-sec" onclick="act('chart')"><i class="fa-solid fa-image"></i> Grafik</button>
    <button class="btn btn-sec" onclick="act('ai')"><i class="fa-solid fa-brain"></i> AI Tahlil</button>
    <button class="btn btn-red" onclick="act('close')"><i class="fa-solid fa-stop"></i> Yopish</button>
  </div>

  <div class="card glass">
    <h3><i class="fa-solid fa-bolt"></i> Ochiq Bitim & Darajalar</h3>
    <div id="trade_box">
       <div style="color:var(--muted); font-style:italic;">Ma'lumot yuklanmoqda...</div>
    </div>
  </div>

  <div class="card glass">
    <h3><i class="fa-solid fa-rotate"></i> Narxni Sinxronlash (/sync)</h3>
    <div class="flex-row">
      <input type="number" step="0.01" id="sync_p" placeholder="Broker narxi (masalan 2915.40)">
      <button class="btn btn-gold w-auto" onclick="syncPrice()">Sinxron</button>
    </div>
  </div>

  <div class="card glass">
    <h3><i class="fa-solid fa-building-columns"></i> MT5 Hisoblar (Avto-Trade)</h3>
    <div id="exness_list" class="mb-3">...</div>
    <input id="ex_login" placeholder="MT5 Login ID">
    <input id="ex_pass" type="password" placeholder="MT5 Parol">
    <div class="flex-row">
      <input id="ex_srv" placeholder="Server (AUTO)" value="AUTO">
      <input id="ex_lot" type="number" step="0.01" placeholder="Lot (0.01)" value="0.01">
    </div>
    <button class="btn btn-green mt-2" onclick="addExness()"><i class="fa-solid fa-plus"></i> Hisob Ulash</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
